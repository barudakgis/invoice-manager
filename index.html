    '<div class="jenis-pick">' +
      '<button class="jp'+(k.jenis==='masuk'?' aktif in':'')+'" onclick="kasSetJenis(\'masuk\')">↓ Pemasukan</button>' +
      '<button class="jp'+(k.jenis==='keluar'?' aktif out':'')+'" onclick="kasSetJenis(\'keluar\')">↑ Pengeluaran</button>' +
    '</div>' +
    '<div class="field"><label>Jumlah *</label><input id="ksJumlah" type="number" min="0" inputmode="numeric" value="'+(k.jumlah||'')+'" placeholder="0"></div>' +
    '<div class="grid-2">' +
      '<div class="field"><label>Tanggal</label><input id="ksTanggal" type="date" value="'+esc(k.tanggal)+'"></div>' +
      '<div class="field"><label>Kategori</label><select id="ksKategori">' +
        kats.map(function(c){ return '<option'+(k.kategori===c?' selected':'')+'>'+c+'</option>'; }).join('') +
      '</select></div>' +
    '</div>' +
    '<div class="field"><label>Keterangan</label><input id="ksKeterangan" value="'+esc(k.keterangan||'')+'" placeholder="mis. beli besi siku 4 batang"></div>' +
    '<div class="field"><label>Metode</label><select id="ksMetode">' +
      METODE_KAS.map(function(m){ return '<option value="'+m+'"'+(k.metode===m?' selected':'')+'>'+m.charAt(0).toUpperCase()+m.slice(1)+'</option>'; }).join('') +
    '</select></div>' +
    (k.invoiceNumber?'<div class="detail-row"><span>Dari Invoice</span><b>'+esc(k.invoiceNumber)+'</b></div>':'') +
    '<div class="modal-actions">' +
      (k.id?'<button class="btn btn-danger" onclick="hapusKas(\''+k.id+'\')">Hapus</button>':'') +
      '<button class="btn btn-ghost" onclick="closeModal()">Batal</button>' +
      '<button class="btn btn-primary" onclick="simpanKas()">Simpan</button>' +
    '</div></div>');
}
function kasSetJenis(j){
  syncKasForm();
  kasState.jenis = j;
  kasState.kategori = (j==='masuk'?KAT_MASUK:KAT_KELUAR)[0];
  renderKasEditor();
}
function syncKasForm(){
  if(!$('ksJumlah')) return;
  kasState.jumlah = Number($('ksJumlah').value)||0;
  kasState.tanggal = $('ksTanggal').value;
  kasState.kategori = $('ksKategori').value;
  kasState.keterangan = $('ksKeterangan').value.trim();
  kasState.metode = $('ksMetode').value;
}
function simpanKas(){
  syncKasForm();
  if(!kasState.jumlah || kasState.jumlah <= 0){ toast('Jumlah harus lebih dari 0.'); return; }
  loading(true);
  api('saveKas', kasState).then(function(rec){
    state.db.kas = state.db.kas || [];
    var i = state.db.kas.findIndex(function(x){ return String(x.id)===String(rec.id); });
    if(i>=0) state.db.kas[i] = rec; else state.db.kas.unshift(rec);
    loading(false); closeModal(); toast('Transaksi tersimpan ✓'); render();
  }).catch(function(e){ loading(false); toast(e.message); });
}
function hapusKas(id){
  if(!confirm('Hapus transaksi ini?')) return;
  loading(true);
  api('deleteKas', { id:id }).then(function(){
    state.db.kas = (state.db.kas||[]).filter(function(x){ return String(x.id)!==String(id); });
    loading(false); closeModal(); toast('Transaksi dihapus'); render();
  }).catch(function(e){ loading(false); toast(e.message); });
}
function tarikInvoice(){
  if(!guardWrite()) return;
  if(!confirm('Catat semua invoice berstatus LUNAS yang belum tercatat sebagai pemasukan?')) return;
  loading(true);
  api('tarikDariInvoice').then(function(r){
    toast(r.ditambahkan ? (r.ditambahkan+' invoice dicatat ✓') : 'Tidak ada invoice baru untuk dicatat');
    return reloadData(false);
  }).catch(function(e){ loading(false); toast(e.message); });
}
function unduhKasCsv(){
  var data = kasTerfilter();
  if(!data.length){ toast('Tidak ada data untuk diunduh.'); return; }
  var head = ['tanggal','jenis','kategori','keterangan','jumlah','metode','invoice'];
  var csv = head.join(',') + '\n' + data.map(function(k){
    return [k.tanggal,k.jenis,k.kategori,k.keterangan,k.jumlah,k.metode,k.invoiceNumber||''].map(function(v){
      return '"' + String(v===undefined?'':v).replace(/"/g,'""') + '"';
    }).join(',');
  }).join('\n');
  var blob = new Blob([csv], { type:'text/csv;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'pembukuan-' + (kasTahun||'semua') + (kasBulan?('-'+kasBulan):'') + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  toast('CSV diunduh ✓');
}

var MATERAI_MIN = 5000000;      // UU No. 10/2020: di atas Rp5.000.000

function wajibMaterai(total, jenis){
  if(jenis && !MATERAI_JENIS[jenis]) return false;
  return (Number(total)||0) > MATERAI_MIN;
}

  { n:'Peruri Digital Security', u:'https://e-meterai.co.id/' },
  { n:'Mitra Pajakku', u:'https://pajakku.e-meterai.co.id' },
  { n:'Mitracomm Ekasarana', u:'https://mitracomm.e-meterai.co.id' },

  a.download = 'contoh-impor-pembukuan.csv';

  toast('Berkas contoh diunduh ✓');
}
/* Pemisah CSV yang menghormati tanda kutip */
function pisahCsv(baris){
  var out=[], cur='', dalam=false;
  for(var i=0;i<baris.length;i++){
    var c = baris[i];
    if(c === '"'){
      if(dalam && baris[i+1] === '"'){ cur += '"'; i++; }
      else dalam = !dalam;
    } else if((c === ',' || c === ';') && !dalam){ out.push(cur); cur=''; }
    else cur += c;
  }
  out.push(cur);
  return out.map(function(x){ return x.trim(); });
}
function normalTanggal(t){
  t = String(t||'').trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
  var m = /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/.exec(t);   // dd/mm/yyyy
  if(m) return m[3]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[1]).padStart(2,'0');
  m = /^(\d{4})[\/](\d{1,2})[\/](\d{1,2})$/.exec(t);
  if(m) return m[1]+'-'+String(m[2]).padStart(2,'0')+'-'+String(m[3]).padStart(2,'0');
  return '';
}
function bacaCsvKas(input){
  var f = input.files && input.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(e){
    var teks = String(e.target.result).replace(/^\ufeff/,'');
    var baris = teks.split(/\r?\n/).filter(function(x){ return x.trim(); });
    if(baris.length < 2){ toast('Berkas kosong atau hanya berisi judul kolom.'); return; }
    var kolom = pisahCsv(baris[0]).map(function(h){ return h.toLowerCase().replace(/"/g,''); });
    var idx = function(nama){ return kolom.indexOf(nama); };
    var iT=idx('tanggal'), iJ=idx('jenis'), iK=idx('kategori'), iD=idx('keterangan'), iN=idx('jumlah'), iM=idx('metode');
    if(iT<0 || iN<0){ toast('Kolom "tanggal" dan "jumlah" wajib ada.'); return; }

    var siap=[], tolak=[];
    for(var i=1;i<baris.length;i++){
      var c = pisahCsv(baris[i]);
      var tgl = normalTanggal(c[iT]);
      var jml = Number(String(c[iN]||'').replace(/[^0-9.-]/g,''))||0;
      if(!tgl){ tolak.push('Baris '+(i+1)+': tanggal "'+(c[iT]||'')+'" tidak dikenali'); continue; }
      if(jml<=0){ tolak.push('Baris '+(i+1)+': jumlah tidak valid'); continue; }
      siap.push({ tanggal:tgl, jenis:(iJ>=0?c[iJ]:'masuk'), kategori:(iK>=0?c[iK]:''),
        keterangan:(iD>=0?c[iD]:''), jumlah:jml, metode:(iM>=0?c[iM]:'tunai') });
    }
    _imporBaris = siap;
    var masuk = siap.filter(function(x){ return String(x.jenis).toLowerCase().indexOf('keluar')<0; });
    var keluar = siap.filter(function(x){ return String(x.jenis).toLowerCase().indexOf('keluar')>=0; });
    var totalM = masuk.reduce(function(s,x){return s+x.jumlah;},0);
    var totalK = keluar.reduce(function(s,x){return s+x.jumlah;},0);
    var cur = (state.db.settings||{}).defaultCurrency||'IDR';
    var rentang = siap.length ? (siap.map(function(x){return x.tanggal;}).sort()[0] + ' s/d ' + siap.map(function(x){return x.tanggal;}).sort().reverse()[0]) : '-';

    $('imporHasil').innerHTML =
      '<div class="card card-p" style="margin-top:12px">' +
        '<b style="font-size:13px">Pratinjau</b>' +
        '<div class="detail-row"><span>Siap diimpor</span><b>'+siap.length+' transaksi</b></div>' +
        '<div class="detail-row"><span>Rentang tanggal</span><b>'+esc(rentang)+'</b></div>' +
        '<div class="detail-row"><span>Pemasukan</span><b>'+masuk.length+' · '+fmtMoney(totalM,cur)+'</b></div>' +
        '<div class="detail-row"><span>Pengeluaran</span><b>'+keluar.length+' · '+fmtMoney(totalK,cur)+'</b></div>' +
        (tolak.length?'<div class="lic-warn" style="margin-top:10px">'+tolak.length+' baris dilewati:<br>'+esc(tolak.slice(0,4).join(' · '))+(tolak.length>4?' …':'')+'</div>':'') +
        (siap.length?'<button class="btn btn-primary btn-block" style="margin-top:12px" onclick="jalankanImpor()">✓ Impor '+siap.length+' Transaksi</button>':'') +
      '</div>';
  };
  r.onerror = function(){ toast('Gagal membaca berkas.'); };
  r.readAsText(f);
  input.value = '';
}
function jalankanImpor(){
  if(!_imporBaris.length) return;
  if(!confirm('Impor '+_imporBaris.length+' transaksi ke pembukuan?')) return;
  loading(true);
  api('imporKas', { baris:_imporBaris }).then(function(r){
    toast(r.masuk + ' transaksi diimpor ✓');
    _imporBaris = [];
    closeModal();
    return reloadData(false);
  }).catch(function(e){ loading(false); toast(e.message); });
}

    '<div class="tbl-scroll"><table class="lap-tbl"><tr><th>Tanggal</th><th>Keterangan</th><th>Akun</th>' +

    var umur = jt ? Math.floor((kini - jt)/86400000) : 0;

  }).sort(function(a,b){ return b.umur - a.umur; });
}

  }).join('') + '</div>';

/* ---------------- LAPORAN KEUANGAN ---------------- */
/* Periode sebelumnya: bulan lalu, atau tahun lalu bila memilih setahun penuh */
function periodeSebelum(th, bl){
  if(!th) return null;
  if(bl){
    var m = Number(bl) - 1, y = Number(th);
    if(m < 1){ m = 12; y -= 1; }
    return { tahun:String(y), bulan:String(m).padStart(2,'0') };
  }
  return { tahun:String(Number(th)-1), bulan:'' };
}
function hitungLaporan(th, bl){
  th = (th === undefined) ? lapTahun : th;
  bl = (bl === undefined) ? lapBulan : bl;
  var cur = (state.db.settings||{}).defaultCurrency || 'IDR';
  var semua = state.db.kas || [];
  var data = semua.filter(function(k){ return cocokPeriode(k, th, bl); });

  // Kategori yang dianggap penambah aset tetap, bukan beban
  var ASET = { 'Peralatan':1 };
  var MODAL = { 'Modal':1 };

  var pendapatan = {}, beban = {}, asetBeli = 0, modalMasuk = 0;
  data.forEach(function(k){
    if(k.jenis === 'masuk'){
      if(MODAL[k.kategori]) { modalMasuk += k.jumlah; return; }
      pendapatan[k.kategori] = (pendapatan[k.kategori]||0) + k.jumlah;
    } else {
      if(ASET[k.kategori]) { asetBeli += k.jumlah; return; }
      beban[k.kategori] = (beban[k.kategori]||0) + k.jumlah;
    }
  });
  var totalPendapatan = Object.keys(pendapatan).reduce(function(s,k){ return s+pendapatan[k]; },0);
  var totalBeban = Object.keys(beban).reduce(function(s,k){ return s+beban[k]; },0);
  var labaBersih = totalPendapatan - totalBeban;

  // Neraca — posisi sampai akhir periode (kumulatif, bukan hanya periode terpilih)
  var batas = th ? (bl ? (th+'-'+bl) : (th+'-12')) : '';
  var sampai = batas ? function(k){ return String(k.tanggal||'').substring(0,7) <= batas; } : function(){ return true; };
  var kum = semua.filter(sampai);
  var saldoKas = kum.reduce(function(s,k){ return s + (k.jenis==='masuk'?k.jumlah:-k.jumlah); },0);
  var asetTetap = kum.filter(function(k){ return k.jenis==='keluar' && ASET[k.kategori]; })
                     .reduce(function(s,k){ return s+k.jumlah; },0);
  var modalKum = kum.filter(function(k){ return k.jenis==='masuk' && MODAL[k.kategori]; })
                    .reduce(function(s,k){ return s+k.jumlah; },0);
  var labaKum = kum.reduce(function(s,k){
    if(k.jenis==='masuk') return MODAL[k.kategori] ? s : s + k.jumlah;
    return ASET[k.kategori] ? s : s - k.jumlah;
  },0);
  var piutang = piutangData().reduce(function(s,d){ return s+(Number(d.inv.total)||0); },0);
  var persediaan = (state.db.stok||[]).reduce(function(s,b){ return s + (Number(b.stok)||0)*(Number(b.hargaBeli)||0); },0);

  var totalAset = saldoKas + piutang + persediaan + asetTetap;
  var ekuitas = modalKum + labaKum;
  // Piutang & persediaan belum tercatat di kas → selisihnya menjadi ekuitas belum terealisasi
  var ekuitasTampil = totalAset;   // kewajiban belum dilacak, jadi Aset = Ekuitas

  // Arus kas
  var arusMasuk = data.filter(function(k){return k.jenis==='masuk';}).reduce(function(s,k){return s+k.jumlah;},0);
  var arusKeluar = data.filter(function(k){return k.jenis==='keluar';}).reduce(function(s,k){return s+k.jumlah;},0);
  var awalPeriode = th ? (bl ? (th+'-'+bl) : (th+'-01')) : '';
  var sebelum = awalPeriode ? semua.filter(function(k){ return String(k.tanggal||'').substring(0,7) < awalPeriode; }) : [];
  var saldoAwal = sebelum.reduce(function(s,k){ return s + (k.jenis==='masuk'?k.jumlah:-k.jumlah); },0);

  return { cur:cur, pendapatan:pendapatan, beban:beban, totalPendapatan:totalPendapatan, totalBeban:totalBeban,
    labaBersih:labaBersih, saldoKas:saldoKas, piutang:piutang, persediaan:persediaan, asetTetap:asetTetap,
    totalAset:totalAset, modalKum:modalKum, labaKum:labaKum, ekuitas:ekuitasTampil,
    arusMasuk:arusMasuk, arusKeluar:arusKeluar, saldoAwal:saldoAwal, saldoAkhir:saldoAwal+arusMasuk-arusKeluar };
}

  var labaRugi = '<div class="card card-p lap-card"><div class="lap-judul">Laporan Laba Rugi</div>' +

    '</table></div></div>';

function afterLaporan(){

    type:'doughnut',
    data:{ labels:['Kas','Piutang','Persediaan','Peralatan'],
      datasets:[{ data:[Math.max(0,L.saldoKas), L.piutang, L.persediaan, L.asetTetap],

function cetakLaporan(){

  var kolom = P ? 3 : 2;

    return '<tr class="'+(cls||'')+'"><td>'+a+'</td><td class="tr">'+b+'</td>' +

  var katB = Object.keys(L.beban).concat(P?Object.keys(P.beban):[]).filter(function(v,i,a){return a.indexOf(v)===i;}).sort();
  var pend = katP.map(function(k){ return brs(esc(k), fmtMoney(L.pendapatan[k]||0,cur), '', P?fmtMoney(P.pendapatan[k]||0,cur):''); }).join('');
  var beb = katB.map(function(k){ return brs(esc(k), fmtMoney(L.beban[k]||0,cur), '', P?fmtMoney(P.beban[k]||0,cur):''); }).join('');
  var html = '<div class="print-sheet lap-sheet">' +
    '<div class="dok-head"><div class="dok-brand">' +
      (s.logoUrl?'<img class="dok-logo" src="'+esc(s.logoUrl)+'" onerror="this.style.display=\'none\'">':'') +
      '<div><div class="dok-co">'+esc(s.companyName||'')+'</div>' +

      '<div class="dok-to"><div class="dok-place">Dicetak '+fmtDate(todayStr())+'</div></div></div>' +
    '<div class="dok-title"><h2>LAPORAN KEUANGAN</h2><div class="dok-no">'+esc(judulPeriode)+'</div></div>' +
    '<h3 class="lap-h">Laba Rugi</h3><table class="lap-print">'+kepala+'<tr class="g"><th colspan="'+kolom+'">Pendapatan</th></tr>'+pend+
      brs('<b>Total Pendapatan</b>','<b>'+fmtMoney(L.totalPendapatan,cur)+'</b>','t', P?fmtMoney(P.totalPendapatan,cur):'') +
      '<tr class="g"><th colspan="'+kolom+'">Beban Usaha</th></tr>'+beb+
      brs('<b>Total Beban</b>','<b>'+fmtMoney(L.totalBeban,cur)+'</b>','t', P?fmtMoney(P.totalBeban,cur):'') +
      brs('<b>'+(L.labaBersih<0?'Rugi Bersih':'Laba Bersih')+'</b>','<b>'+fmtMoney(L.labaBersih,cur)+'</b>','h', P?fmtMoney(P.labaBersih,cur):'') + '</table>' +
    '<h3 class="lap-h">Neraca</h3><table class="lap-print">'+kepala+'<tr class="g"><th colspan="'+kolom+'">Aset</th></tr>' +
      brs('Kas &amp; Setara Kas', fmtMoney(L.saldoKas,cur), '', P?fmtMoney(P.saldoKas,cur):'') +
      brs('Piutang Usaha', fmtMoney(L.piutang,cur), '', P?fmtMoney(P.piutang,cur):'') +
      brs('Persediaan Barang', fmtMoney(L.persediaan,cur), '', P?fmtMoney(P.persediaan,cur):'') +
      brs('Peralatan', fmtMoney(L.asetTetap,cur), '', P?fmtMoney(P.asetTetap,cur):'') +
      brs('<b>Total Aset</b>','<b>'+fmtMoney(L.totalAset,cur)+'</b>','t', P?fmtMoney(P.totalAset,cur):'') +
      '<tr class="g"><th colspan="'+kolom+'">Kewajiban &amp; Ekuitas</th></tr>' +
      brs('Kewajiban', fmtMoney(0,cur), '', P?fmtMoney(0,cur):'') +
      brs('Modal Disetor', fmtMoney(L.modalKum,cur), '', P?fmtMoney(P.modalKum,cur):'') +
      brs('Laba Ditahan', fmtMoney(L.totalAset-L.modalKum,cur), '', P?fmtMoney(P.totalAset-P.modalKum,cur):'') +
      brs('<b>Total Kewajiban &amp; Ekuitas</b>','<b>'+fmtMoney(L.totalAset,cur)+'</b>','t', P?fmtMoney(P.totalAset,cur):'') + '</table>' +

var stokQ = '', stokFilter = 'semua';
function stokList(){
  return (state.db.stok||[]).slice().sort(function(a,b){ return String(a.nama||'').localeCompare(String(b.nama||'')); });
}
function viewStok(){
  var cur = (state.db.settings||{}).defaultCurrency || 'IDR';
  var semua = stokList();
  var menipis = semua.filter(function(b){ return b.minStok > 0 && b.stok <= b.minStok; });
  var nilai = semua.reduce(function(s,b){ return s + b.stok * b.hargaBeli; },0);
  var data = semua.filter(function(b){
    if(stokFilter==='menipis' && !(b.minStok>0 && b.stok<=b.minStok)) return false;
    if(stokFilter==='habis' && b.stok > 0) return false;
    return !stokQ || ((b.nama||'')+' '+(b.kode||'')+' '+(b.kategori||'')).toLowerCase().indexOf(stokQ.toLowerCase())>=0;
  });

  var kartu = '<div class="kas-stats">' +
    '<div class="kas-card in"><div class="l">Jenis Barang</div><div class="n">'+semua.length+'</div></div>' +
    '<div class="kas-card out'+(menipis.length?'':'')+'"><div class="l">Perlu Restok</div><div class="n">'+menipis.length+'</div></div>' +
    '<div class="kas-card bal"><div class="l">Nilai Persediaan</div><div class="n">'+fmtMoney(nilai,cur)+'</div></div>' +
    '<div class="kas-card net"><div class="l">Total Unit</div><div class="n">'+semua.reduce(function(s,b){return s+b.stok;},0)+'</div></div>' +
    '</div>';

  var toolbar = '<div class="toolbar">' +
    (isViewer()?'':'<button class="btn btn-primary btn-sm" onclick="openStokEditor()">+ Barang Baru</button>') +
    '<input placeholder="Cari nama / kode..." value="'+esc(stokQ)+'" oninput="stokQ=this.value;render()">' +
    '<select onchange="stokFilter=this.value;render()">' +
      '<option value="semua"'+(stokFilter==='semua'?' selected':'')+'>Semua</option>' +
      '<option value="menipis"'+(stokFilter==='menipis'?' selected':'')+'>Perlu Restok</option>' +
      '<option value="habis"'+(stokFilter==='habis'?' selected':'')+'>Stok Habis</option>' +
    '</select></div>';

  var peringatan = menipis.length ? '<div class="warn-bar">⚠ ' + menipis.length + ' barang perlu segera direstok: ' +
    esc(menipis.slice(0,3).map(function(b){ return b.nama+' ('+b.stok+' '+b.satuan+')'; }).join(', ')) +
    (menipis.length>3?', dan lainnya':'') + '</div>' : '';

  var daftar = data.length ? '<div class="card">' + data.map(stokRow).join('') + '</div>'
    : '<div class="empty"><b>Belum ada barang</b><br>Catat persediaan barang dagangan atau bahan baku di sini. Fitur ini opsional — abaikan bila usaha Anda tidak menyimpan stok.</div>';

  var mutasi = (state.db.mutasi||[]).slice(-12).reverse();
  var riwayat = mutasi.length ? '<div class="card card-p"><div class="section-title" style="margin-top:0">Mutasi Terakhir</div>' +
    mutasi.map(function(m){
      var ic = m.jenis==='masuk'?'in':(m.jenis==='keluar'?'out':'adj');
      var tanda = m.jenis==='masuk'?'+':(m.jenis==='keluar'?'−':'=');
      return '<div class="mut-row"><span class="mut-ic '+ic+'">'+tanda+'</span>' +
        '<div class="mut-main"><b>'+esc(m.nama)+'</b><div class="mini">'+fmtDate(m.tanggal)+(m.keterangan?' · '+esc(m.keterangan):'')+'</div></div>' +
        '<b class="mut-qty '+ic+'">'+tanda+' '+m.qty+'</b></div>';
    }).join('') + '</div>' : '';

  return kartu + peringatan + toolbar + daftar + riwayat;
}
function stokRow(b){
  var cur = (state.db.settings||{}).defaultCurrency || 'IDR';
  var kritis = b.minStok > 0 && b.stok <= b.minStok;
  var habis = b.stok <= 0;
  return '<div class="list-item" style="cursor:pointer" onclick="openStokDetail(\'' + b.id + '\')">' +
    '<div class="stok-ic'+(habis?' habis':(kritis?' kritis':''))+'">'+esc(String(b.nama||'?').charAt(0).toUpperCase())+'</div>' +
    '<div class="li-main"><div class="t1">'+esc(b.nama)+(b.kode?' <span class="mini">'+esc(b.kode)+'</span>':'')+'</div>' +
    '<div class="t2">'+esc(b.kategori||'—')+' · beli '+fmtMoney(b.hargaBeli,cur)+' · jual '+fmtMoney(b.hargaJual,cur)+'</div></div>' +
    '<div class="li-amt"><div class="stok-qty'+(habis?' habis':(kritis?' kritis':''))+'">'+b.stok+' <span class="mini">'+esc(b.satuan||'')+'</span></div>' +
    (kritis?'<div class="a2" style="color:var(--red)">min '+b.minStok+'</div>':'')+'</div></div>';

    '<div class="detail-row"><span>Stok Minimum</span><b>'+b.minStok+'</b></div>' +
    '<div class="detail-row"><span>Harga Beli</span><b>'+fmtMoney(b.hargaBeli,cur)+'</b></div>' +
    '<div class="detail-row"><span>Harga Jual</span><b>'+fmtMoney(b.hargaJual,cur)+'</b></div>' +

    (mut.length?'<div class="section-title">Mutasi Terakhir</div>' + mut.map(function(m){
      return '<div class="mini" style="padding:3px 0">'+fmtDate(m.tanggal)+' · '+esc(m.jenis)+' '+m.qty+(m.keterangan?' — '+esc(m.keterangan):'')+'</div>';
    }).join('') : '') +
    '<div class="modal-actions" style="flex-wrap:wrap">' +
      (state.user.role==='admin'?'<button class="btn btn-danger btn-sm" onclick="hapusStok(\''+b.id+'\')">Hapus</button>':'') +
      '<button class="btn btn-ghost btn-sm" onclick="openStokEditor(\''+b.id+'\')">Edit</button>' +

    '</div></div>');
}
var stokState = null;
function openStokEditor(id){
  if(!guardWrite()) return;
  var b = id ? (state.db.stok||[]).find(function(x){ return String(x.id)===String(id); }) : null;
  stokState = b ? JSON.parse(JSON.stringify(b))
    : { id:'', kode:'', nama:'', kategori:'', satuan:'pcs', stok:0, minStok:0, hargaBeli:0, hargaJual:0, aktif:true };
  openModal('<div class="modal narrow"><h3>'+(id?'Ubah':'Tambah')+' Barang</h3>' +

    '<div class="grid-2">' +
      '<div class="field"><label>Kode / SKU</label><input id="stKode" value="'+esc(stokState.kode)+'"></div>' +
      '<div class="field"><label>Kategori</label><input id="stKat" value="'+esc(stokState.kategori)+'" placeholder="mis. Bahan"></div>' +
      '<div class="field"><label>Satuan</label><input id="stSatuan" value="'+esc(stokState.satuan)+'" placeholder="pcs / kg / batang"></div>' +
      '<div class="field"><label>'+(id?'Stok Saat Ini':'Stok Awal')+'</label><input id="stStok" type="number" value="'+stokState.stok+'"'+(id?' disabled':'')+'></div>' +

    '<button class="btn btn-primary" onclick="simpanStok()">Simpan</button></div></div>');

function simpanStok(){
  var p = {
    id: stokState.id,
    nama: $('stNama').value.trim(), kode: $('stKode').value.trim(), kategori: $('stKat').value.trim(),
    satuan: $('stSatuan').value.trim() || 'pcs', minStok: Number($('stMin').value)||0,
    hargaBeli: Number($('stBeli').value)||0, hargaJual: Number($('stJual').value)||0, aktif:true
  };
  if(!stokState.id) p.stok = Number($('stStok').value)||0;
  if(!p.nama){ toast('Nama barang wajib diisi.'); return; }
  loading(true);
  api('saveStok', p).then(function(){ closeModal(); toast('Barang tersimpan ✓'); return reloadData(false); })
    .catch(function(e){ loading(false); toast(e.message); });
}
function hapusStok(id){
  if(!confirm('Hapus barang ini? Riwayat mutasinya tetap tersimpan.')) return;
  loading(true);
  api('deleteStok', { id:id }).then(function(){ closeModal(); toast('Barang dihapus'); return reloadData(false); })
    .catch(function(e){ loading(false); toast(e.message); });
}
function openMutasi(stokId, jenis){
  if(!guardWrite()) return;
  var b = (state.db.stok||[]).find(function(x){ return String(x.id)===String(stokId); });
  if(!b) return;
  var masuk = jenis === 'masuk';
  openModal('<div class="modal narrow"><h3>'+(masuk?'Barang Masuk':'Barang Keluar')+'</h3>' +
    '<div class="detail-row"><span>Barang</span><b>'+esc(b.nama)+'</b></div>' +
    '<div class="detail-row"><span>Stok Sekarang</span><b>'+b.stok+' '+esc(b.satuan||'')+'</b></div>' +
    '<div class="field"><label>Jumlah *</label><input id="mtQty" type="number" min="1" placeholder="0"></div>' +
    '<div class="field"><label>Harga per '+esc(b.satuan||'unit')+'</label><input id="mtHarga" type="number" value="'+(masuk?b.hargaBeli:b.hargaJual)+'"></div>' +
    '<div class="field"><label>Tanggal</label><input id="mtTanggal" type="date" value="'+todayStr()+'"></div>' +
    '<div class="field"><label>Keterangan</label><input id="mtKet" placeholder="'+(masuk?'mis. beli dari supplier':'mis. dipakai untuk pesanan')+'"></div>' +
    '<label class="check-row"><input type="checkbox" id="mtKas" checked> Catat sekaligus ke Pembukuan</label>' +
    '<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Batal</button>' +
    '<button class="btn btn-primary" onclick="simpanMutasi(\''+stokId+'\',\''+jenis+'\')">Simpan</button></div></div>');
}
function simpanMutasi(stokId, jenis){
  var qty = Number($('mtQty').value)||0;
  if(qty <= 0){ toast('Jumlah harus lebih dari 0.'); return; }
  loading(true);
  api('saveMutasi', { stokId:stokId, jenis:jenis, qty:qty, harga:Number($('mtHarga').value)||0,
    tanggal:$('mtTanggal').value, keterangan:$('mtKet').value.trim(), catatKas:$('mtKas').checked })
    .then(function(){ closeModal(); toast('Mutasi tercatat ✓'); return reloadData(false); })
    .catch(function(e){ loading(false); toast(e.message); });
}

// Satu baris metode pembayaran
function pmRow(m, idx){
  var typeSel = '<select onchange="setPmType('+idx+',this.value)" style="max-width:170px">' +
    PM_TYPES.map(function(t){ return '<option value="'+t.v+'"'+(m.type===t.v?' selected':'')+'>'+t.label+'</option>'; }).join('') + '</select>';
  var fields = '';
  var bind = function(key, lbl, val, ph){ return '<div class="field" style="margin-bottom:8px"><label>'+lbl+'</label><input value="'+esc(val||'')+'" placeholder="'+esc(ph||'')+'" oninput="state.db.settings.paymentMethods['+idx+'].'+key+'=this.value"></div>'; };
  if(m.type==='bank'){
    fields = bind('label','Nama Bank',m.label,'mis. BCA, Mandiri, BRI') + bind('accountNumber','No. Rekening',m.accountNumber,'') + bind('accountName','Atas Nama',m.accountName,'');
  } else if(m.type==='qris'){
    fields = bind('note','Keterangan (opsional)',m.note,'mis. QRIS tersedia di invoice');
  } else if(m.type==='other'){
    fields = bind('label','Nama Metode',m.label,'mis. PayPal, Virtual Account') + bind('accountNumber','No. / ID',m.accountNumber,'') + bind('accountName','Atas Nama',m.accountName,'');
  } else {
    fields = bind('accountNumber','No. HP / ID '+pmLabel(m.type),m.accountNumber,'08xxxxxxxxxx') + bind('accountName','Atas Nama',m.accountName,'');
  }
  return '<div class="card" style="padding:12px;margin-bottom:10px;background:var(--bg)">' +
    '<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">'+typeSel+
      '<button class="iconbtn red" style="width:30px;height:30px;margin-left:auto" onclick="removePaymentMethod('+idx+')">✕</button></div>' +
    fields + '</div>';
}
// Simpan nilai form yang belum tersimpan ke state agar tidak hilang saat render ulang
function syncSettingsForm(){
  var s = state.db.settings; if(!s) return;
  var g = function(id){ var e=$(id); return e?e.value:undefined; };
  var set = function(k,id){ var v=g(id); if(v!==undefined) s[k]=k==='appName'?(v.trim()||'Universal Invoice Manager'):v.trim(); };
  set('appName','stAppName'); set('companyName','stCompanyName'); set('companyEmail','stCompanyEmail');
  set('companyPhone','stCompanyPhone'); set('companyWebsite','stCompanyWebsite');
  var addr=$('stCompanyAddress'); if(addr) s.companyAddress=addr.value.trim();
  var cur=$('stDefaultCurrency'); if(cur) s.defaultCurrency=cur.value;
  var re=$('stReminderEmail'); if(re) s.reminderEmailTemplate=re.value;
  var rw=$('stReminderWa'); if(rw) s.reminderWhatsappTemplate=rw.value;
}
function addPaymentMethod(){
  syncSettingsForm();
  state.db.settings.paymentMethods = state.db.settings.paymentMethods||[];
  state.db.settings.paymentMethods.push({ id:'pm-'+Date.now(), type:'bank', label:'', accountNumber:'', accountName:'', note:'' });
  render();
}
function removePaymentMethod(idx){
  syncSettingsForm();
  state.db.settings.paymentMethods.splice(idx,1); render();
}
function setPmType(idx,val){
  syncSettingsForm();
  state.db.settings.paymentMethods[idx].type = val; render();
}
function removeTaxRate(idx){
  syncSettingsForm();
  state.db.settings.taxRates.splice(idx,1); render();
}
function addTaxRate(){
  syncSettingsForm();
  state.db.settings.taxRates = state.db.settings.taxRates||[];
  state.db.settings.taxRates.push({ id:'tax-'+Date.now(), name:'Pajak Baru', rate:0, isActive:true });

/* Service worker (hanya di hosting statis / HTTPS).
   updateViaCache:'none' memaksa peramban SELALU mengambil sw.js dari jaringan,
   supaya pembaruan aplikasi tidak tertahan cache lama. */
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0 && !IS_GAS){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function(reg){
      try { reg.update(); } catch(e){}
      setInterval(function(){ try { reg.update(); } catch(e){} }, 60*60*1000);
      reg.addEventListener('updatefound', function(){
        var sw = reg.installing;
        if(!sw) return;
        sw.addEventListener('statechange', function(){
          if(sw.state === 'installed' && navigator.serviceWorker.controller){
            tampilkanPembaruan();
          }
        });
      });
    }).catch(function(e){ console.warn('SW gagal:', e); });
    var reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', function(){
      if(reloading) return; reloading = true; location.reload();
    });
  });
}
function tampilkanPembaruan(){
  if(document.getElementById('updBar')) return;
  var bar = document.createElement('div');
  bar.id = 'updBar';
  bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:300;' +
    'background:#0B7A5C;color:#fff;border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;' +
    'box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:13.5px;font-weight:600';
  bar.innerHTML = '<span style="flex:1">Versi baru aplikasi tersedia.</span>' +
    '<button style="border:none;border-radius:10px;padding:8px 14px;font-weight:800;font-family:inherit;' +
    'background:#fff;color:#075C45;cursor:pointer" onclick="muatUlangPembaruan()">Muat Ulang</button>';
  document.body.appendChild(bar);
}
function muatUlangPembaruan(){
  if('serviceWorker' in navigator){
    navigator.serviceWorker.getRegistrations().then(function(rs){
      rs.forEach(function(r){ if(r.waiting) r.waiting.postMessage({ type:'SKIP_WAITING' }); });
      setTimeout(function(){ location.reload(); }, 400);
    });
  } else { location.reload(); }
}
